name: Nowzen iOS Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'altstore/source.json'
  workflow_dispatch:
    inputs:
      configuration:
        description: Native build configuration (release_arm64 is the small optimized IPA; debug_arm64 compiles faster but is ~500 MB)
        type: choice
        default: release_arm64
        options: [release_arm64, debug_arm64, debug_sim_arm64]
      native_build:
        description: Run the full native build after source checks
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: nowzen-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  AYU_SKIP_DSYM: "1"
  CONFIGURATION: ${{ inputs.configuration || 'release_arm64' }}

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 240
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Select pinned Xcode and report resources
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          sw_vers
          df -h

      - name: Verify macOS build dependencies
        run: bash ci/prepare_macos.sh

      - name: Check Telegram API credentials
        run: |
          python3 - <<'PY'
          import os, re
          api_id = os.environ.get('TELEGRAM_API_ID', '').strip()
          api_hash = os.environ.get('TELEGRAM_API_HASH', '').strip()
          if not api_id or not api_hash:
              print('::warning::TELEGRAM_API_ID / TELEGRAM_API_HASH secrets are not set; building compilation-only IPA.')
          elif not api_id.isdigit() or int(api_id) <= 0 or not re.fullmatch(r'[0-9a-fA-F]{32}', api_hash):
              raise SystemExit('TELEGRAM_API_ID / TELEGRAM_API_HASH have an invalid format.')
          else:
              print('Telegram API credentials are configured.')
          PY

      - name: Fetch pinned Telegram source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          pin = json.load(open('upstream.json'))
          subprocess.run(['git', 'init', 'telegram'], check=True)
          subprocess.run(['git', '-C', 'telegram', 'remote', 'add', 'origin', pin['repository']], check=True)
          subprocess.run(['git', '-C', 'telegram', 'fetch', '--depth=1', 'origin', pin['commit']], check=True)
          subprocess.run(['git', '-C', 'telegram', 'checkout', '--detach', 'FETCH_HEAD'], check=True)
          PY

      - name: Apply port and run source checks
        run: |
          set -euo pipefail
          {
            python3 ci/prepare.py telegram
            git -C telegram diff --check
            python3 -m unittest discover -s ci/tests -p 'test_*.py'
            python3 ci/preflight.py telegram
            python3 ci/test_models.py telegram | tee "$RUNNER_TEMP/ayu-tests.log"
          } 2>&1 | tee "$RUNNER_TEMP/ayu-checks.log"

      - name: Fetch pinned native dependencies
        if: github.event_name == 'push' || inputs.native_build
        run: |
          set -euo pipefail
          git -C telegram submodule update --init --recursive --jobs=8 --depth=1 \
            || git -C telegram submodule update --init --recursive --jobs=8

      - name: Restore Bazel disk cache
        id: bazel-cache
        if: github.event_name == 'push' || inputs.native_build
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ayu-bazel-cache
          key: nowzen-bazel-${{ env.CONFIGURATION }}-${{ hashFiles('upstream.json') }}-${{ github.sha }}
          restore-keys: |
            nowzen-bazel-${{ env.CONFIGURATION }}-${{ hashFiles('upstream.json') }}-

      - name: Build native Nowzen iOS port
        if: github.event_name == 'push' || inputs.native_build
        run: python3 -u ci/build.py telegram --phase port --configuration "$CONFIGURATION"

      - name: Save Bazel disk cache
        if: always() && (github.event_name == 'push' || inputs.native_build) && steps.bazel-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ayu-bazel-cache
          key: nowzen-bazel-${{ env.CONFIGURATION }}-${{ hashFiles('upstream.json') }}-${{ github.sha }}

      - name: Show errors on the run page
        if: failure()
        run: python3 ci/annotate_failure.py "Nowzen build failed" "$RUNNER_TEMP/ayu-checks.log" telegram/artifacts/port/build.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: Nowzen-ios-${{ env.CONFIGURATION }}-unsigned-${{ github.run_number }}
          path: telegram/artifacts/port/Nowzen.ipa
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: Nowzen-ios-logs-${{ github.run_number }}
          path: |
            telegram/artifacts/port/build.log
            ${{ runner.temp }}/ayu-tests.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Attest the IPA
        if: success() && hashFiles('telegram/artifacts/port/*.ipa') != ''
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: telegram/artifacts/port/*.ipa

      - name: Publish release and update AltStore source
        if: success() && env.CONFIGURATION == 'release_arm64' && (github.event_name == 'push' || inputs.native_build) && hashFiles('telegram/artifacts/port/Nowzen.ipa') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_VERSION=$(python3 - <<'PY'
          import plistlib, zipfile
          with zipfile.ZipFile("telegram/artifacts/port/Nowzen.ipa") as zf:
              info = plistlib.loads(zf.read("Payload/Telegram.app/Info.plist"))
          print(info.get("CFBundleShortVersionString", "1.0.0"))
          PY
          )
          TAG="v${APP_VERSION}-b${GITHUB_RUN_NUMBER}"
          IPA_FILE="Nowzen-${TAG}.ipa"
          cp "telegram/artifacts/port/Nowzen.ipa" "$IPA_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA_FILE" --clobber
          else
            gh release create "$TAG" "$IPA_FILE" \
              --target "$GITHUB_SHA" \
              --title "Nowzen ${APP_VERSION} (build ${GITHUB_RUN_NUMBER})" \
              --notes "Automated build #${GITHUB_RUN_NUMBER} from \`${GITHUB_SHA}\`." \
              --latest
          fi
          node altstore/update-source.mjs "$APP_VERSION" "$GITHUB_RUN_NUMBER" "$TAG" "$IPA_FILE" "Nowzen ${APP_VERSION} (build ${GITHUB_RUN_NUMBER})"
          rm -f "$IPA_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore/source.json
          if ! git diff --cached --quiet; then
            git commit -m "Update AltStore source for ${TAG} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Free disk space
        if: always()
        continue-on-error: true
        run: |
          cd telegram
          for bazel in build-input/bazel-*-darwin-arm64; do "$bazel" clean --expunge || true; done
          df -h . | tail -1
