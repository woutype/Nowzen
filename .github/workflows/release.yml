name: Release (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Nowzen version, e.g. 1.0.1
        required: true
      run_id:
        description: ID of the successful "Nowzen iOS Build & Release" run whose IPA to publish
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: Nowzen-ios-*
          path: artifact/ios
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p files
          ipa=$(find artifact/ios -name '*.ipa' | head -n 1)
          test -n "$ipa" || { echo "::error::run $RUN_ID has no IPA"; exit 1; }
          cp "$ipa" "files/Nowzen-v${VERSION}.ipa"
          tipa=$(find artifact/ios -name '*.tipa' | head -n 1 || true)
          if [ -n "$tipa" ]; then cp "$tipa" "files/Nowzen-v${VERSION}-TrollStore.tipa"; fi
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .head_sha)
          number=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .run_number)
          {
            echo "## Nowzen v${VERSION}"
            echo ""
            echo "iOS: build ${number}, commit \`${sha}\`"
            echo ""
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            for f in files/*; do
              echo "| $(basename "$f") | $(numfmt --to=iec --suffix=B "$(stat -c %s "$f")") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
          } > release-notes.md
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" files/* --clobber
            gh release edit "v${VERSION}" --title "Nowzen v${VERSION}" --notes-file release-notes.md --latest
          else
            gh release create "v${VERSION}" files/* --target "$GITHUB_SHA" --title "Nowzen v${VERSION}" --notes-file release-notes.md --latest
          fi
